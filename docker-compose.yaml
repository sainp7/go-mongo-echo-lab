version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=bookstore
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "echo -e 'GET /health HTTP/1.0\r\n' | nc localhost 8080 | grep -q '200 OK'" ]
      interval: 30s
      timeout: 10s
      retries: 3


  mongo:
    image: mongo:latest
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: